.pr-note{font-size:12px;color:#777;line-height:1.5;margin:7px 0}.pr-pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf4ff;color:#1769aa;font-size:11px;font-weight:600}.pr-item{padding:11px 0;border-bottom:1px solid #eee}.pr-item:last-child{border:0}.pr-actions{display:flex;gap:8px;flex-wrap:wrap}.pr-actions .btn{flex:1;min-width:105px;font-size:12px;padding:10px}.pr-total{font-size:24px;font-weight:700;color:#007aff}.pr-box{background:#f5f5f7;border-radius:10px;padding:12px;margin:10px 0}.pr-small{font-size:11px;color:#777}.pr-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pr-row b{white-space:nowrap}

<body>
<div class="topbar">
  <h1>💼 Mi Caja</h1>
  <div class="sub" id="fh"></div>
</div>
<div id="s-res" class="sc on"></div>
<div id="s-trab" class="sc"></div>
<div id="s-fijos" class="sc"></div>
<div id="s-new" class="sc"></div>
<div id="s-pres" class="sc"></div>
<div id="s-det" class="sc"></div>
<div id="modal"></div>
<nav class="bottomnav">
  <button class="bnb on" onclick="go('res')"><span class="bni">📊</span><span class="bnl">Inicio</span></button>
  <button class="bnb" onclick="go('trab')"><span class="bni">💼</span><span class="bnl">Trabajos</span></button>
  <button class="bnb" onclick="go('fijos')"><span class="bni">🏠</span><span class="bnl">Mi dinero</span></button>
  <button class="bnb" onclick="go('new')"><span class="bni">➕</span><span class="bnl">Nuevo</span></button>
  <button class="bnb" onclick="go('pres')"><span class="bni">📐</span><span class="bnl">Presup.</span></button>
</nav>
<script>
var DB='micaja_v2';
var DATA;try{DATA=JSON.parse(localStorage.getItem(DB)||'{"tj":[],"fijos":[]}');}catch(e){DATA={tj:[],fijos:[],presupuestos:[]};alert('No se pudieron leer los datos guardados. Exporta un respaldo antes de registrar cambios.');}
if(!DATA.tj)DATA.tj=[];if(!DATA.fijos)DATA.fijos=[];if(!Array.isArray(DATA.presupuestos))DATA.presupuestos=[];
var TJ=DATA.tj,FJ=DATA.fijos,PR=DATA.presupuestos;
var AC=null,MT='adelanto',NW=[];
var hoy=new Date();
var MFILTRO={y:hoy.getFullYear(),m:hoy.getMonth()};
var dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESES_FULL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var REPCOLORS=['#007AFF','#34C759','#5856D6','#FF9500','#FF3B30','#0d9488','#db2777','#ea580c'];
document.getElementById('fh').textContent=dias[hoy.getDay()]+' '+hoy.getDate()+' '+meses[hoy.getMonth()]+' '+hoy.getFullYear();
var CATS_NEG=['Agua','Luz','Gas','Internet','Alquiler local','Otro negocio'];
var CATS_PERS=['Alquiler cuarto','Seguro salud','SOAT','Otro personal'];

// Categorías por tipo de movimiento — FIJAS para evitar confusión
var CATS={
  adelanto:['Yape','Efectivo','Transferencia','Depósito'],
  ingreso:['Yape','Efectivo','Transferencia','Depósito'],
  obra:['Materiales','Herramientas','Transporte obra','Alimentación obra','Otro'],
  personal:['Movilidad','Desayuno','Almuerzo','Cena','Gasto hormiga','Otro'],
  pago:['Yape','Efectivo','Transferencia','Depósito'],
  fijo:['Agua','Luz','Gas','Internet','Alquiler','Otro']
};
// Etiquetas de tipo de movimiento, reutilizadas en varios lados
var TLABELS={adelanto:'Adelanto',ingreso:'Pago final',obra:'Gasto obra',personal:'Gasto personal',pago:'Pago trabajador',fijo:'Gasto fijo'};
// Signo de cada tipo de movimiento para calcular saldo acumulado
var SIGNO={adelanto:1,ingreso:1,obra:-1,personal:-1,pago:-1,fijo:-1};

function sv(){localStorage.setItem(DB,JSON.stringify({tj:TJ,fijos:FJ,presupuestos:PR}));}
function fm(n){return 'S/'+Math.abs(n).toFixed(2);}
function fs(n){return 'S/'+Math.abs(Math.round(n));}
function ini(n){var p=(n||'?').trim().split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function cm(){document.getElementById('modal').innerHTML='';}
function fechaHoy(){var h=new Date();return h.getDate()+'/'+(h.getMonth()+1)+'/'+h.getFullYear();}
function horaAhora(){var h=new Date();return h.getHours().toString().padStart(2,'0')+':'+h.getMinutes().toString().padStart(2,'0');}
function fechaHora(){return fechaHoy()+' '+horaAhora();}

// Toast de confirmación breve al guardar algo
function toast(msg){
  var t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){t.style.opacity='1';});
  setTimeout(function(){
    t.style.opacity='0';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300);
  },1900);
}

function calc(t){
  var a=0,i2=0,o=0,gp={},pg={},gf=0,pagos=0;
  var ws=t.ws||[{id:'yo',n:'Yo',tp:'pct',v:100}];
  ws.forEach(function(w){gp[w.id]=0;pg[w.id]=0;});
  (t.movs||[]).forEach(function(m){
    if(m.t==='adelanto') a+=m.m;
    else if(m.t==='ingreso') i2+=m.m;
    else if(m.t==='obra') o+=m.m;
    else if(m.t==='personal'){
      var k=m.p&&gp[m.p]!==undefined?m.p:'yo';
      gp[k]=(gp[k]||0)+m.m;
    }
    else if(m.t==='pago'){
      var k2=m.p&&pg[m.p]!==undefined?m.p:'yo';
      pg[k2]=(pg[k2]||0)+m.m;
      pagos+=m.m;
    }
    else if(m.t==='fijo') gf+=m.m;
  });
  var cob=a+i2;
  var tgp=Object.values(gp).reduce(function(x,y){return x+y;},0);
  // disponible = todo lo que entró - todo lo que salió
  var disp=cob-o-tgp-gf-pagos;

  var rep=t.reparto||[];
  var repCalc={};
  rep.forEach(function(r){repCalc[r.id]=r.tp==='pct'?(disp*(r.v/100)):r.v;});
  var gEmpresa=rep.filter(function(r){return r.esEmpresa;}).reduce(function(a,r){return a+repCalc[r.id];},0);
  var mw=ws.find(function(w){return w.id==='yo';})||ws[0];
  var mp;
  if(rep.length>0){
    var myRep=rep.find(function(r){return r.esYo;});
    mp=myRep?repCalc[myRep.id]:0;
  } else {
    mp=mw.tp==='pct'?(disp*(mw.v/100)):mw.v;
  }
  mp=Math.max(0,mp);

  // CORREGIDO: lo que ya recibió cada trabajador = gastos personales suyos + pagos directos
  var pp={};
  ws.forEach(function(w){
    var debe=w.tp==='pct'?(disp*(w.v/100)):w.v;
    // ya recibió = sus gastos personales + pagos que le hiciste
    var yaRecibio=(gp[w.id]||0)+(pg[w.id]||0);
    pp[w.id]=Math.max(0,debe-yaRecibio);
  });

  return{a,i2,cob,o,gp,pg,pp,gf,pagos,disp,mp,gEmpresa,repCalc,tgp,
    pc:t.total>0?(t.total-cob):0};
}

// Calcula el saldo en caja acumulado en el momento de cada movimiento (orden cronológico real)
function saldoPorMov(t){
  var movsChron=(t.movs||[]).slice().reverse(); // se guardan con unshift => reverse = orden cronológico
  var running=0,map={};
  movsChron.forEach(function(m){
    running+=(SIGNO[m.t]||0)*m.m;
    map[m.id]=running;
  });
  return map;
}

function br(lbl,val,mx,col,tc){
  var p=Math.round((Math.abs(val)/Math.max(Math.abs(mx),1))*100);
  return '<div class="bar"><div class="bl">'+lbl+'</div><div class="bt"><div class="bf" style="width:'+p+'%;background:'+col+';"></div></div><div class="bv" style="color:'+tc+';">'+fs(val)+'</div></div>';
}

// Gráfico de cascada: cobrado -> gastos -> disponible, más intuitivo que barras sueltas
function waterfall(c){
  var steps=[
    {lbl:'Cobrado',from:0,to:c.cob,color:'#639922',tc:'#3b6d11'},
    {lbl:'Gasto obra',from:c.cob,to:c.cob-c.o,color:'#E24B4A',tc:'#a32d2d'},
    {lbl:'Gastos personal',from:c.cob-c.o,to:c.cob-c.o-c.tgp,color:'#E24B4A',tc:'#a32d2d'},
    {lbl:'Gastos fijos',from:c.cob-c.o-c.tgp,to:c.cob-c.o-c.tgp-c.gf,color:'#E24B4A',tc:'#a32d2d'},
    {lbl:'Pagos trabajadores',from:c.cob-c.o-c.tgp-c.gf,to:c.disp,color:'#E24B4A',tc:'#a32d2d'},
    {lbl:'Disponible',from:0,to:c.disp,color:'#378ADD',tc:'#185fa5'}
  ];
  var max=Math.max(Math.abs(c.cob),Math.abs(c.disp),1);
  var html='<div class="wf-wrap">';
  steps.forEach(function(s){
    var lo=Math.min(s.from,s.to),hi=Math.max(s.from,s.to);
    var leftPct=Math.max(0,Math.min(100,(lo/max)*100));
    var widthPct=Math.max(1,Math.min(100-leftPct,((hi-lo)/max)*100));
    var amt=s.to-s.from;
    html+='<div class="wf-row"><div class="wf-lbl"><span>'+s.lbl+'</span><b style="color:'+s.tc+';">'+(amt<0?'-':(s.lbl==='Cobrado'||s.lbl==='Disponible'?'':'-'))+fm(amt)+'</b></div>'+

function cambiarMes(delta){
  MFILTRO.m+=delta;
  if(MFILTRO.m>11){MFILTRO.m=0;MFILTRO.y++;}
  if(MFILTRO.m<0){MFILTRO.m=11;MFILTRO.y--;}
  rRes();
}

function tjDelMes(){
  return TJ.filter(function(t){
    var partes=t.f.split('/');
    if(partes.length===3){
      var m2=parseInt(partes[1])-1,y2=parseInt(partes[2]);
      if(y2===MFILTRO.y&&m2===MFILTRO.m)return true;
    }
    return (t.movs||[]).some(function(mv){
      if(!mv.fh)return false;
      var p=mv.fh.split('/');
      if(p.length<2)return false;
      return parseInt(p[1])-1===MFILTRO.m&&parseInt(p[2])===MFILTRO.y;
    });
  });
}

function totalFijosMes(){
  return FJ.filter(function(f){
    var d=new Date(f.ts);return d.getMonth()===MFILTRO.m&&d.getFullYear()===MFILTRO.y;
  }).reduce(function(a,f){return a+f.m;},0);
}

function exportBackup(){
  var data=localStorage.getItem(DB)||'{"tj":[],"fijos":[]}';
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  var fecha=fechaHoy().replace(/\//g,'-');
  a.href=url;a.download='micaja-backup-'+fecha+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('✓ Backup descargado');
}

function importBackupFile(input){
  var file=input.files&&input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var parsed;
    try{ parsed=JSON.parse(e.target.result); }
    catch(err){ alert('El archivo no es un backup válido de Mi Caja.'); input.value=''; return; }
    if(!parsed||!Array.isArray(parsed.tj)||!Array.isArray(parsed.fijos)){
      alert('El archivo no tiene el formato esperado de Mi Caja.'); input.value=''; return;
    }
    if(!confirm('Esto va a REEMPLAZAR todos los datos actuales de este dispositivo por los del backup. ¿Continuar?')){
      input.value=''; return;
    }
    DATA=parsed; TJ=DATA.tj; FJ=DATA.fijos; PR=Array.isArray(DATA.presupuestos)?DATA.presupuestos:[]; sv();
    input.value='';
    alert('✓ Backup importado correctamente.');
    go('res');
  };
  reader.onerror=function(){ alert('No se pudo leer el archivo.'); input.value=''; };
  reader.readAsText(file);
}

function abrirReparto(){
  if(!AC) return;
  var c=calc(AC);
  var rep=AC.reparto||[];
  var disp=c.disp;
  function calcRepMonto(r){return r.tp==='pct'?(disp*(r.v/100)):r.v;}
  var asignado=rep.reduce(function(a,r){return a+calcRepMonto(r);},0);
  var restante=disp-asignado;
  var pct=disp>0?Math.min(100,(asignado/disp)*100):0;
  var segmentos=rep.map(function(r,i){
    var p=disp>0?(calcRepMonto(r)/disp)*100:0;
    return '<div class="rep-seg" style="width:'+p+'%;background:'+REPCOLORS[i%REPCOLORS.length]+';"></div>';
  }).join('');
  var rCls=Math.abs(restante)<0.01?'rep-ok':restante>0?'rep-warn':'rep-over';
  var rTxt=Math.abs(restante)<0.01?'✅ Todo repartido':restante>0?'⚠️ Faltan '+fm(restante):'🚫 Te pasaste '+fm(Math.abs(restante));
  var repRows=rep.map(function(r,i){
    var s=calcRepMonto(r);
    var eTag=r.esEmpresa?'<span class="empresa-tag">EMPRESA</span>':r.esYo?'<span class="empresa-tag" style="background:#e8f0ff;color:#007AFF;">TÚ</span>':'';

      '<div class="rep-info"><div class="rep-nombre">'+(r.esEmpresa?'🏢':'👤')+' '+r.n+eTag+'</div>'+
      '<div class="rep-sub">'+(r.tp==='pct'?r.v+'%':'fijo')+' → '+fm(s)+'</div></div>'+
      '<input class="rep-inp" type="number" value="'+r.v+'" onchange="editRep(\''+r.id+'\',this.value)">'+
      '<span class="rep-tipo-lbl">'+(r.tp==='pct'?'%':'S/')+'</span>'+
      '<button onclick="delRep(\''+r.id+'\')" style="background:none;border:none;cursor:pointer;color:#FF3B30;font-size:18px;padding:4px;">×</button>'+
    '</div>';
  }).join('');
  document.getElementById('modal').innerHTML=
    '<div class="modal-bg" onclick="cm()"><div class="modal-sheet" onclick="event.stopPropagation()">'+
    '<div class="modal-handle"></div>'+
    '<div class="modal-title">💰 Reparto<br><span style="font-size:13px;color:#888;font-weight:400;">Disponible: '+fm(disp)+'</span></div>'+
    '<div class="rep-barra-wrap">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px;">'+
        '<span>Asignado: '+fm(asignado)+'</span><span>Total: '+fm(disp)+'</span></div>'+
      '<div class="rep-barra">'+segmentos+(pct<100?'<div class="rep-seg" style="width:'+(100-pct)+'%;background:#f0f0f0;"></div>':'')+
      '</div></div>'+
    '<div class="rep-restante '+rCls+'">'+rTxt+'</div>'+
    repRows+
    '<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid #f0f0f0;">'+
      '<div style="font-size:12px;color:#888;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;">Agregar persona</div>'+
      '<div class="r2" style="margin-bottom:8px;">'+

function exportCSV(){
  if(!AC) return;
  var c=calc(AC),ws=AC.ws||[],rows=[];
  var saldoMap=saldoPorMov(AC);
  rows.push(['RESUMEN','','','','']);
  rows.push(['Trabajo',AC.n,'','','']);
  rows.push(['Cliente/Nota',AC.nota||'','','','']);
  rows.push(['Fecha inicio',AC.f,'','','']);
  rows.push(['Fecha cierre',AC.fcierre||'En curso','','','']);
  rows.push(['Total acordado',AC.total||'No definido','','','']);
  rows.push(['Cobrado',c.cob.toFixed(2),'','','']);
  rows.push(['Gasto obra',c.o.toFixed(2),'','','']);
  rows.push(['Gastos personales',c.tgp.toFixed(2),'','','']);
  rows.push(['Pagos a trabajadores',c.pagos.toFixed(2),'','','']);
  rows.push(['Gastos fijos',c.gf.toFixed(2),'','','']);
  rows.push(['Disponible',c.disp.toFixed(2),'','','']);
  rows.push(['Mi parte',c.mp.toFixed(2),'','','']);
  rows.push(['Ganancia empresa',c.gEmpresa.toFixed(2),'','','']);
  rows.push(['','','','','']);
  if(AC.reparto&&AC.reparto.length){
    rows.push(['REPARTO','Tipo','Valor','Monto calculado','']);
    AC.reparto.forEach(function(r){
      var s=r.tp==='pct'?(c.disp*(r.v/100)):r.v;
      rows.push([r.n+(r.esEmpresa?' (EMPRESA)':r.esYo?' (YO)':''),r.tp==='pct'?'Porcentaje':'Monto fijo',r.v,s.toFixed(2),'']);
    });
    rows.push(['','','','','']);
  }
  rows.push(['TRABAJADORES','Tipo pago','Corresponde','Ya recibió (gastos+pagos)','Falta']);
  ws.forEach(function(w){
    var yaRecibio=(c.gp[w.id]||0)+(c.pg[w.id]||0);
    var pp=c.pp[w.id]||0;
    var debe=w.tp==='pct'?(c.disp*(w.v/100)):w.v;
    rows.push([w.n,w.tp==='pct'?(w.v+'%'):('S/'+w.v),debe.toFixed(2),yaRecibio.toFixed(2),pp.toFixed(2)]);
  });
  rows.push(['','','','','','']);
  rows.push(['MOVIMIENTOS','Tipo','Categoría','Persona','Monto','Fecha y hora','Saldo en caja']);
  AC.movs.forEach(function(m){
    var wn=(ws.find(function(w){return w.id===m.p;})||{n:''}).n;
    rows.push([m.d,TLABELS[m.t]||m.t,m.cat||'',wn,m.m.toFixed(2),m.fh||'',(saldoMap[m.id]!==undefined?saldoMap[m.id].toFixed(2):'')]);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=(AC.n||'trabajo').replace(/[^a-z0-9]/gi,'-')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function prEsc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function prNum(x){return Math.max(0,Number(x)||0);}
function prF(x){return 'S/ '+(Number(x)||0).toFixed(2);}
function prId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function prById(id){return PR.find(function(p){return p.id===id;});}
function prArea(a){if(a.manual!==null&&a.manual!==undefined&&a.manual!=='')return prNum(a.manual);var l=prNum(a.largo),w=prNum(a.ancho),h=prNum(a.alto);var per=2*(l+w);var bruto=a.tipo==='paredes'?per*h:l*w;return Math.max(0,bruto-prNum(a.huecos));}
function prTarifa(a){return prNum(a.tarifa);}
function prImporte(a){return prArea(a)*prTarifa(a);}
function prTot(p){return (p.areas||[]).reduce(function(t,a){return t+prImporte(a);},0);}
function prProtecTot(p){return (p.protecciones||[]).reduce(function(t,z){return t+Math.ceil(prNum(z.m2)/(prNum(z.an)*prNum(z.la)||1))*prNum(z.precio);},0);}
function prMatTot(p){return (p.materiales||[]).reduce(function(t,m){return t+prNum(m.cantidad)*prNum(m.precio);},0);}
function prPersonalTot(p){return (p.personal||[]).reduce(function(t,x){return t+prNum(x.cantidad)*prNum(x.jornal)*prNum(x.dias);},0);}
function prAcarreoTot(p){return (p.acarreos||[]).reduce(function(t,x){return t+prNum(x.costo);},0);}
function prAcarreoHoras(p){return (p.acarreos||[]).reduce(function(t,x){return t+prNum(x.horas)*prNum(x.ayudantes||0);},0);}
function prAcarreoCosto(p){return (p.acarreos||[]).reduce(function(t,x){return t+prNum(x.costoReal);},0);}

function prAcarreoOportunidad(p){return Math.max(0,prAcarreoCosto(p)-prAcarreoExtra(p));}
function prMaterialMargen(p){return (p.materiales||[]).reduce(function(t,m){return t+prNum(m.cantidad)*(prNum(m.precioVenta===undefined?m.precio:m.precioVenta)-prNum(m.precio));},0);}

function pSaveDay(){var status=document.getElementById('pd-work').value,earned=Number(document.getElementById('pd-earned').value),transport=Number(document.getElementById('pd-transport').value);if((status==='yes')&&(!Number.isFinite(earned)||earned<0||!Number.isFinite(transport)||transport<0)){alert('Revisa ingreso y transporte.');return;}PF.days=PF.days.filter(function(d){return d.date!==pSelected;});PF.expenses=PF.expenses.filter(function(x){return x.autoDate!==pSelected;});if(status){var work=status==='yes';PF.days.push({date:pSelected,work:work,earned:work?earned:0,transport:work?transport:0});if(work&&transport>0)PF.expenses.push({id:pId(),date:pSelected,cat:'Transporte al trabajo',m:transport,note:'Pasaje automático',auto:true,autoDate:pSelected});}pSave();rFijos();toast('✓ Día guardado');}

function coMoney(n){return 'S/ '+(Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function coInit(p){if(!p.cotizacion)p.cotizacion={cliente:'',documento:'',telefono:'',ubicacion:'',fecha:new Date().toISOString().slice(0,10),alcance:'Servicio de pintura y acabados según las condiciones de la obra.',detalles:'PROTECCIÓN DE AMBIENTES Y SUPERFICIES: Protección de pisos, muebles y áreas de trabajo.\nPREPARACIÓN DE SUPERFICIES: Limpieza, lijado y resanes necesarios.\nAPLICACIÓN DE PINTURA: Aplicación del acabado acordado en las superficies indicadas.\nLIMPIEZA Y ENTREGA: Retiro de protecciones y limpieza básica de la zona intervenida.',plazo:'',adelanto:25,contra:75,precioFinal:'',modalidad:'Según alcance acordado',observaciones:''};return p.cotizacion;}

function coSave(silent){var p=prById(PR_ACT);if(!p)return false;var a=Number(coVal('co-adelanto')),b=Number(coVal('co-contra')),override=coVal('co-precio').trim();if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0||a>100||b>100||Math.abs(a+b-100)>0.001){alert('El adelanto y el pago conforme avance de obra deben sumar 100%.');return false;}var plazoTxt=coVal('co-plazo').trim();if(plazoTxt!==''&&(!Number.isInteger(Number(plazoTxt))||Number(plazoTxt)<1)){alert('El plazo debe ser un número entero de días mayor que cero.');return false;}if(override!==''&&(!Number.isFinite(Number(override))||Number(override)<0)){alert('Revisa el precio final.');return false;}p.cotizacion={cliente:coVal('co-cliente').trim(),documento:coVal('co-documento').trim(),telefono:coVal('co-telefono').trim(),fecha:coVal('co-fecha'),ubicacion:coVal('co-ubicacion').trim(),alcance:coVal('co-alcance').trim(),detalles:coVal('co-detalles').trim(),plazo:coVal('co-plazo').trim(),modalidad:coVal('co-modalidad').trim(),adelanto:a,contra:b,precioFinal:override,observaciones:coVal('co-obs').trim()};sv();if(!silent)toast('✓ Cotización guardada');return true;}

iv><div class="muted">Soluciones de color, pintura y acabados</div></div></div><div class="title">PRESUPUESTO DE OBRA</div><div class="sub">MEMORIA DESCRIPTIVA Y COTIZACIÓN</div><div class="meta"><div><b>PROYECTO:</b> '+coText(p.nombre)+'</div><div><b>FECHA:</b> '+coText(date)+'</div><div><b>CLIENTE:</b> '+coText(q.cliente||'—')+'</div><div><b>DNI/RUC:</b> '+coText(q.documento||'—')+'</div><div><b>UBICACIÓN:</b> '+coText(q.ubicacion||'—')+'</div><div><b>TELÉFONO:</b> '+coText(q.telefono||'—')+'</div></div><div class="rule"></div><h2>ALCANCE DEL SERVICIO</h2><p>'+coText(q.alcance)+'</p><h2>1. ESPECIFICACIONES TÉCNICAS</h2><ul>'+rows+'</ul><div class="rule"></div><div class="avoid"><div class="total">INVERSIÓN TOTAL: '+coMoney(total)+'</div><div class="note" style="text-align:center">'+coText(q.modalidad)+'</div></div><div class="rule"></div><div class="terms avoid"><div class="termsbody"><h2>CONDICIONES COMERCIALES</h2><div><b>Plazo de ejecución:</b> '+(q.plazo?coText(q.plazo)+' '+(Number(q.plazo)===1?'día':'días'):'Por definir')+'</div><div><b>Adelanto para inicio de obra:</b> '+q.adelanto+'% — '+coMoney(total*q.adelanto/100)+'</div><div><b>Pago conforme avance de obra:</b> '+q.contra+'% — '+coMoney(total*q.contra/100)+'</div>'+(q.observaciones?'<p class="note">'+coText(q.observaciones)+'</p>':'')+'</div><img class="qr" src="'+CO_QR+'" alt="QR WhatsApp"></div><div class="foot"></div><div class="screenonly" style="text-align:center;margin:25px"><button onclick="window.print()" style="background:#c74733;color:white;padding:12px 22px;border:0;border-radius:8px;font-size:15px;cursor:pointer">Imprimir / Guardar como PDF</button></div></body></html>';var w=window.open('','_blank');if(!w){alert('El navegador bloqueó la ventana. Permite ventanas emergentes para generar el PDF.');return;}w.document.open();w.document.write(html);w.document.close();w.focus();toast('✓ Cotización lista para imprimir o guardar como PDF');}
